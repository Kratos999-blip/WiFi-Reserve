name: Gerar APK Wi-Fi Reserve

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extrair projeto Android
        run: |
          unzip -o WiFi_Reserve_Android_Projeto.zip -d projeto
          find projeto -type f | head -50

      - name: Compilar APK
        run: |
          GRADLE_FILE=$(find projeto -name gradlew -type f | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERRO: O ZIP não contém o executável gradlew."
            exit 1
          fi
          chmod +x "$GRADLE_FILE"
          cd "$(dirname "$GRADLE_FILE")"
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Reserve-APK
          path: projeto/**/*.apk
          if-no-files-found: error
